<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Seasonal ids</title>
        <style>
        #Rain {background-color: blue;}
        #summer {background-color: yellow;}
        #warning {color: orange;}
        </style>
    </head>
    <body>
        
        <h1>Today's forecast.</h1>
        
        <h2 id="summer">It's QUITE hot today.</h2>
        <p id="Rain">And it's gonna rain tonight!!!</p>
        <p id="warning">Bring an umbrella. Or sunscreen. Or both.</p>
    </body>
</html>
